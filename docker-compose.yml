name: silp

# One command from a clean checkout:   docker compose up --build
#   web  http://localhost:8080        (nginx: SPA + /api proxy)
#   api  http://localhost:3000/api/v1 (OpenAPI UI at /api/v1/docs)
# Tests:                               docker compose --profile test run --build --rm test
# Every variable has a development default; override in .env (see .env.example).

x-api-env: &api-env
  # production refuses the placeholder secrets below; set real ones in .env first.
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 3000
  DATABASE_URL: postgres://${POSTGRES_USER:-silp}:${POSTGRES_PASSWORD:-silp_dev_password}@postgres:5432/${POSTGRES_DB:-silp}
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:-dev-only-compose-session-secret-change-me-0123456789}
  SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
  SESSION_ABSOLUTE_TIMEOUT_HOURS: ${SESSION_ABSOLUTE_TIMEOUT_HOURS:-12}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-1111111111111111111111111111111111111111111111111111111111111111}
  DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
  SEED_ON_START: ${SEED_ON_START:-true}
  SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Imani#Dev2026!}
  IMPORT_MAX_FILE_MB: ${IMPORT_MAX_FILE_MB:-10}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-2222222222222222222222222222222222222222222222222222222222222222}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-10}
  # Background jobs go to BullMQ (Redis) and run in the worker service.
  JOBS_MODE: ${JOBS_MODE:-queue}
  # Sample pharmacy outlets talk to the mock control unit below (not KRA).
  SAMPLE_ETIMS_URL: ${SAMPLE_ETIMS_URL:-http://mock-etims:8088/etims-api}
  # Sample HMIS link talks to the mock FHIR server below (not a real HMIS).
  SAMPLE_HMIS_URL: ${SAMPLE_HMIS_URL:-http://mock-hmis:8090/fhir}
  # Attachments (supplier documents, GRN delivery notes, certificates…) in MinIO (S3).
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-silp-attachments}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-silp}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-silp_dev_minio_password}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-silp}
      TZ: Africa/Nairobi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., target: api }
    environment: *api-env
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
      mock-etims: { condition: service_started }
      mock-hmis: { condition: service_started }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Background worker: runs queued and scheduled jobs (reconciliation, AMC, reorder and expiry alerts, back-order re-planning).
  worker:
    build: { context: ., target: api }
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
      DB_MIGRATIONS_RUN: "false"
      SEED_ON_START: "false"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Development SMTP server: every mail the API sends is visible at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # Mock KRA eTIMS control unit (OSCU paths under /etims-api, VSCU paths at the root).
  # NOT KRA. Inject failures: POST http://localhost:8088/_mock/failure {"mode":"offline"|"timeout"|"http500"|"business"}
  mock-etims:
    build: { context: ., target: api }
    command: ["node", "dist/mock-etims.js"]
    environment:
      MOCK_ETIMS_PORT: 8088
    ports:
      - "${MOCK_ETIMS_PORT:-8088}:8088"
    restart: unless-stopped

  # Mock HMIS (FHIR R4) seeded with the sample patients. Control endpoints under /_mock.
  mock-hmis:
    build: { context: ., target: api }
    command: ["node", "dist/mock-hmis.js"]
    environment:
      MOCK_HMIS_PORT: 8090
    ports:
      - "${MOCK_HMIS_PORT:-8090}:8090"
    restart: unless-stopped

  # S3-compatible object storage for attachments. Console: http://localhost:9001
  # MinIO no longer publishes community images on Docker Hub / quay.io; this is
  # Bitnami's (legacy, unmaintained) build of the 2024-10-13 release, for development.
  # Use a maintained MinIO build or another S3-compatible store in production.
  minio:
    image: bitnamilegacy/minio:2024.10.13
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-silp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-silp_dev_minio_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  test:
    profiles: ["test"]
    build: { context: ., target: test }
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-silp}:${POSTGRES_PASSWORD:-silp_dev_password}@postgres:5432/silp_test
      TEST_REDIS_URL: redis://redis:6379/1
      TEST_STORAGE_DRIVER: s3
      TEST_S3_ENDPOINT: http://minio:9000
      TEST_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-silp}
      TEST_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-silp_dev_minio_password}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
